# Metro Station Finder - Bun Configuration

[install]
exact = true
saveTextLockfile = true
cache = true
production = false
peer = true
lockfile = "bun.lockb"
# Enable faster installs with parallel downloads
concurrent = true
# Cache directory for better performance
cacheDir = ".bun/cache"

[run]
env = ".env.local"
hot = true
watch = true
# Enable source maps for better debugging
sourcemap = "inline"

[dev]
port = 3000
hostname = "localhost"
hot = true
watch = true
https = false
# Enable faster refresh with optimized watching
watchMode = "smart"
# Enable experimental features for better performance
experimental = true

[test]
root = "./test"
coverage = true
coverageThreshold = { 
  line = 0.85, 
  function = 0.85, 
  statement = 0.85,
  branch = 0.80
}
coverageReporter = ["text", "lcov", "html"]
coverageDir = "coverage"
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "**/node_modules/**",
  "**/dist/**",
  "**/out/**",
  "**/.next/**",
  "**/coverage/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/test/**",
  "**/scripts/**",
  "**/app/api/**",
  "**/public/**"
]
concurrent = true
timeout = 15000
preload = ["./test/setup.ts"]
# Enable test isolation for better reliability
isolate = true
# Enable test retry for flaky tests
retry = 2

[build]
outdir = "./out"
target = "browser"
format = "esm"
splitting = true
minify = true
sourcemap = "external"
# Optimize for production builds
optimize = true
# Enable tree shaking for smaller bundles
treeshake = true
external = [
  "react",
  "react-dom",
  "next",
  "next/server",
  "next/navigation",
  "next/image",
  "next/link"
]
# Enable experimental build optimizations
experimental = true

jsx = "react"
jsxFactory = "React.createElement"
jsxFragment = "React.Fragment"
jsxImportSource = "react"
# Enable automatic JSX runtime for better performance
jsxRuntime = "automatic"

[define]
"process.env.NODE_ENV" = "process.env.NODE_ENV"
"process.env.NEXT_PUBLIC_APP_NAME" = "process.env.NEXT_PUBLIC_APP_NAME"
"process.env.NEXT_PUBLIC_APP_VERSION" = "process.env.NEXT_PUBLIC_APP_VERSION"
# Enable Next.js optimizations
"__NEXT_OPTIMIZE_CSS" = "true"
"__NEXT_OPTIMIZE_IMAGES" = "true"

[loader]
".svg" = "file"
".png" = "file"
".jpg" = "file"
".jpeg" = "file"
".gif" = "file"
".webp" = "file"
".avif" = "file"
".ico" = "file"
".woff" = "file"
".woff2" = "file"
".ttf" = "file"
".eot" = "file"
# Additional file types for web assets
".css" = "css"
".scss" = "css"
".sass" = "css"
".less" = "css"
".styl" = "css"

[console]
depth = 3
colors = true
# Enable better error formatting
format = "pretty"

logLevel = "info"

telemetry = false

# Memory optimization for production
smol = false
# Enable memory optimization features
memoryOptimization = true

[performance]
experimental = true
jit = true
optimize = true
fastStart = true

# Metro Station Finder specific optimizations
[metro-station-finder]
# Enable PWA optimizations
pwa = true
# Enable service worker caching
serviceWorker = true
# Enable offline support
offline = true
# Enable map optimizations for Google Maps
mapOptimizations = true
# Enable geolocation optimizations
geolocation = true
