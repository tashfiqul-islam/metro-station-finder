# Explicit installs only; exact direct pins and one readable workspace lock.
[install]
exact = true
auto = "disable"
linker = "isolated"
saveTextLockfile = true
# 3-day release cooldown in seconds; must equal the Renovate minimumReleaseAge.
minimumReleaseAge = 259200

[test]
# Random order exposes shared-state coupling. Bun picks a new seed per run and prints ` --seed=N` in the
# summary; reproduce with `bun test --seed N`. Never set `seed` here: a fixed seed is a fixed order.
randomize = true
# Per-file gate (Bun enforces coverageThreshold file by file). No coveragePathIgnorePatterns on purpose.
coverage = true
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageThreshold = { lines = 0.9, functions = 0.9 }
