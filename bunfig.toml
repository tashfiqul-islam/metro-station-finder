# Explicit installs only; exact direct pins and one readable workspace lock.
[install]
exact = true
auto = "disable"
linker = "isolated"
saveTextLockfile = true
# 3-day release cooldown in seconds; must equal the Renovate minimumReleaseAge.
minimumReleaseAge = 259200

[test]
# Random order exposes shared-state coupling. Bun picks a new seed per run and prints ` --seed=N` in the
# summary; reproduce with `bun test --parallel=4 --seed N` (the order inside a file follows the seed; file-to-worker
# assignment is timing-dependent, so if it does not reproduce try serial). Never set `seed` here: a fixed seed is a fixed order.
randomize = true
# Files Vitest owns (ADR-0016 stages 1 and 2): the API tests run in workerd and the web tests in happy-dom,
# both under vitest, never under Bun.
pathIgnorePatterns = ["apps/api/**", "apps/web/**"]
# Per-file gate, 100 percent lines and functions (METRO-94; Bun enforces coverageThreshold file by file). No coveragePathIgnorePatterns on purpose.
coverage = true
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageThreshold = { lines = 1.0, functions = 1.0 }
