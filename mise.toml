# Runtime pins must match package.json engines.
[tools]
bun = "1.4.4"
node = "26.13.0"
gitleaks = "8.30.1"
hk = "2.11.0"
pkl = "0.32.2"
actionlint = "1.7.12"
zizmor = "1.31.1"
# Owner-approved 2026-11-03 (option A): the only trust-policy exception. @yarnpkg/libzip 3.2.2 has no
# provenance although 3.2.0 had; reviewed and limited to this exact transitive version.
"npm:renovate" = { version = "44.198.3", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }

[tasks.bootstrap]
description = "Verify tools and install the frozen dependency graph"
run = "bun run bootstrap"

[tasks.check]
description = "Run local configuration, boundary, test and type gates"
run = "bun run check"

[tasks.build]
description = "Build web and dry-run the Worker bundle"
run = "bun run build"

[tasks.dev]
description = "Start local web and Worker servers"
run = "bun run dev"

[tasks.smoke]
description = "Check real browser and local Worker behavior"
run = "bun run smoke"

[tasks.format]
description = "Format tracked configuration files"
run = "bun run format"

[tasks.scan]
description = "Scan dependencies and tracked files for known vulnerabilities and secrets"
run = "bun run scan"

[tasks."bundle:check"]
description = "Check production bundle size against the budget"
run = "bun run bundle:check"
