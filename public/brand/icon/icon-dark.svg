<svg viewBox="3 13 34 34" width="48" height="48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Metro Station Finder — Icon Mark (dark background variant) -->
  <!-- Color: oklch(0.64 0.2 145) / #3BBC58 -->
  <!-- H-line: origin → station -->
  <line x1="12.5" y1="24" x2="16" y2="24" stroke="#3BBC58" stroke-width="2.5" stroke-linecap="round"/>
  <!-- V-line: station → destination -->
  <line x1="24" y1="32" x2="24" y2="35.5" stroke="#3BBC58" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Origin: open ring (current position) -->
  <circle cx="9" cy="24" r="3.5" stroke="#3BBC58" stroke-width="2" fill="none"/>
  <!-- Station: dominant filled node -->
  <circle cx="24" cy="24" r="8" fill="#3BBC58"/>
  <!-- Destination: filled dot -->
  <circle cx="24" cy="39" r="3.5" fill="#3BBC58"/>
</svg>
