name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: typecheck · lint · test · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run full CI gate
        run: bun run ci
        env:
          CI: "true"

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run stable Chromium E2E smoke
        run: bun run test:e2e -- --project=chromium --workers=1 tests/e2e/meta.spec.ts tests/e2e/navigation.spec.ts
        env:
          CI: "true"
