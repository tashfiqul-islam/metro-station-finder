name: Reviewer record
# Kept out of quality.yml on purpose: this check must re-run when the pull request body is edited, and quality.yml
# cancels in-flight runs (including the Cloudflare preview deploy) when a new run starts for the same ref.
# A re-run of an old workflow run reuses the old event payload (a stale body); the "edited" trigger below is why
# a corrected body is re-checked with the new text.
on:
  pull_request:
    branches: [feature/metro-rebuild, main]
    types: [opened, edited, synchronize, reopened]
permissions: {}
env:
  # METRO-45: install tools only from mise.lock URLs and checksums.
  MISE_LOCKED: "1"
concurrency:
  group: reviewer-record-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  review:
    name: Reviewer record
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned tools with mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install_args: node
      - name: Reject a body too large to pass safely
        # The body is passed to the next step as one environment string, which Linux limits to 128 KiB. A body
        # can be 65,536 characters of up to 4 bytes each, so more than 32,768 characters could fail with a
        # confusing E2BIG error. This step measures the body in the event payload file with jq; it never puts the
        # body in its environment or in script text.
        run: |
          BODY_LENGTH="$(jq -r '(.pull_request.body // "") | length' "$GITHUB_EVENT_PATH")"
          if [ "$BODY_LENGTH" -gt 32768 ]; then
            echo "The pull request body has $BODY_LENGTH characters; the Reviewer record check supports at most 32768. Shorten the body." >&2
            exit 1
          fi
      - name: Require a recorded independent reviewer
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/reviewer-record.ts
