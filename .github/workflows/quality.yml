name: Quality
on:
  pull_request:
    branches: [feature/metro-rebuild, main]
  push:
    # Keep feature/metro-rebuild until cutover runbook step 6.3 retires the branch: its head needs a
    # Quality gates run for cutover:preflight to read (ADR-0008 item 8). Remove it then, not before.
    branches: [feature/metro-rebuild, main]
permissions: {}
env:
  # METRO-45: install tools only from mise.lock URLs and checksums (jdx/mise-action also adds --locked
  # when mise.lock exists; this keeps it explicit).
  MISE_LOCKED: "1"
concurrency:
  # METRO-59: only pull requests share a group per ref and cancel superseded runs. Each push to an integration
  # branch gets its own group (the commit SHA), so every integration commit keeps a verdict: GitHub also
  # cancels a pending run in a shared group, so a non-cancelling shared group would still lose commits.
  group: quality-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Changes
    # Decides whether build, smoke and the preview may be skipped (METRO-62). A workflow-level paths filter
    # would leave the required "Quality gates" check pending forever, so the decision lives in a job and
    # every other job keeps running. Anything but docs_only=true runs everything.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned tools with mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install_args: node
          cache: false
      - name: Classify the changed files
        id: docs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/changed-files.ts
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned tools with mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
      - name: Install dependencies
        run: bun run bootstrap
      - name: Validate commit messages in the PR range
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/commit-message.ts --range "$BASE_SHA..$HEAD_SHA"
      - name: Run all checks with per-command timing
        run: bun run check:timed
      - name: Upload lcov coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          # Bun's lcov (v8-style lines and functions) and the Vitest workerd run's (istanbul, with branches):
          # two separate runs, two files.
          path: |
            coverage/lcov.info
            coverage/vitest/lcov.info
          if-no-files-found: error
  build:
    name: Build and smoke
    # METRO-90: the four Playwright projects run in parallel, one runner each (this job is Chromium; `smoke`
    # below is Firefox, WebKit and the mobile viewport). Its setup steps must match `smoke`: a test compares them.
    needs: [changes]
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools with mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
      - name: Install dependencies
        run: bun run bootstrap
      - name: Resolve Playwright version and runner image
        id: playwright
        run: |
          echo "version=$(node -p 'require("./package.json").devDependencies["@playwright/test"]')" >> "$GITHUB_OUTPUT"
          echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Keep downloaded system packages in a cacheable directory
        # Playwright's --with-deps runs apt-get as root; its ~100 MB download from the Ubuntu mirror stalled in
        # four hosted runs (docs/evidence/metro-90.md). apt re-checks every cached package against the signed index.
        run: |
          mkdir -p "$HOME/apt-archives/partial"
          echo "Dir::Cache::Archives \"$HOME/apt-archives\";" | sudo tee /etc/apt/apt.conf.d/90-ci-archives > /dev/null
      - name: Restore the system package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Restore the Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Playwright browsers
        # A stalled apt download hung this step for 13 to 20 minutes. Each attempt is cut at 140 s, with one retry
        # (a retry resumes from the partial downloads) after stopping the orphaned apt-get, inside a 5 minute step limit.
        timeout-minutes: 5
        run: |
          for attempt in 1 2; do
            if timeout --kill-after=5s 140s bun run playwright install --with-deps chromium; then exit 0; fi
            echo "::warning::Playwright browser install attempt $attempt failed or timed out"
            # timeout stops bun and sudo but not the root apt-get they started; stop it so the retry gets the dpkg lock.
            sudo pkill -x apt-get || true
            sleep 3
            sudo dpkg --configure -a
          done
          exit 1
      - name: Prepare the system package cache for saving
        run: |
          sudo chown -R "$USER" "$HOME/apt-archives"
          sudo rm -rf "$HOME/apt-archives/partial" "$HOME/apt-archives/lock"
      - name: Build the application
        run: bun run build
      - name: Run browser smoke tests
        # --shuffle picks a seed and prints it ("shuffle seed N"); reproduce with `bun run smoke -- --shuffle N`.
        run: bun run smoke -- --shuffle --project=chromium
      - name: Upload Playwright report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-chromium
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
      - name: Check the bundle budget
        run: bun run bundle:check
  smoke:
    name: Smoke ${{ matrix.project }}
    needs: [changes]
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: firefox
            browsers: firefox
          - project: webkit
            browsers: webkit
          # The Pixel 7 viewport runs in Chromium.
          - project: mobile-chrome
            browsers: chromium
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools with mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
      - name: Install dependencies
        run: bun run bootstrap
      - name: Resolve Playwright version and runner image
        id: playwright
        run: |
          echo "version=$(node -p 'require("./package.json").devDependencies["@playwright/test"]')" >> "$GITHUB_OUTPUT"
          echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Keep downloaded system packages in a cacheable directory
        # Playwright's --with-deps runs apt-get as root; its ~100 MB download from the Ubuntu mirror stalled in
        # four hosted runs (docs/evidence/metro-90.md). apt re-checks every cached package against the signed index.
        run: |
          mkdir -p "$HOME/apt-archives/partial"
          echo "Dir::Cache::Archives \"$HOME/apt-archives\";" | sudo tee /etc/apt/apt.conf.d/90-ci-archives > /dev/null
      - name: Restore the system package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-${{ matrix.browsers }}
      - name: Restore the Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browsers }}
      - name: Install Playwright browsers
        # A stalled apt download hung this step for 13 to 20 minutes. Each attempt is cut at 140 s, with one retry
        # (a retry resumes from the partial downloads) after stopping the orphaned apt-get, inside a 5 minute step limit.
        timeout-minutes: 5
        env:
          BROWSERS: ${{ matrix.browsers }}
        run: |
          for attempt in 1 2; do
            if timeout --kill-after=5s 140s bun run playwright install --with-deps "$BROWSERS"; then exit 0; fi
            echo "::warning::Playwright browser install attempt $attempt failed or timed out"
            # timeout stops bun and sudo but not the root apt-get they started; stop it so the retry gets the dpkg lock.
            sudo pkill -x apt-get || true
            sleep 3
            sudo dpkg --configure -a
          done
          exit 1
      - name: Prepare the system package cache for saving
        run: |
          sudo chown -R "$USER" "$HOME/apt-archives"
          sudo rm -rf "$HOME/apt-archives/partial" "$HOME/apt-archives/lock"
      - name: Build the application
        run: bun run build
      - name: Run browser smoke tests
        # --shuffle picks a seed and prints it ("shuffle seed N"); reproduce with `bun run smoke -- --shuffle N`.
        env:
          PROJECT: ${{ matrix.project }}
        run: bun run smoke -- --shuffle --project="$PROJECT"
      - name: Upload Playwright report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned tools with mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
      - name: Install dependencies
        run: bun run bootstrap
      - name: Scan dependencies and the working tree
        run: bun run scan
      - name: Scan full Git history for secrets
        run: bun run scan:history
  quality:
    name: Quality gates
    if: ${{ always() }}
    needs: [changes, checks, build, smoke, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools with mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install_args: node
      - name: Verify the required job results
        run: node scripts/ci-results.ts
        env:
          REQUIRED_JOB_RESULTS: ${{ toJSON(needs) }}
  preview:
    name: Cloudflare preview
    # Same-repository pull requests only: forks must never receive the Cloudflare secrets, and no bot (Renovate,
    # Dependabot) runs this job, by actor or by pull request author: an unreviewed bump would execute with the
    # token (METRO-47). This job is deliberately outside the "Quality gates" aggregate so Cloudflare
    # availability cannot block merges.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !endsWith(github.actor, '[bot]') && !endsWith(github.event.pull_request.user.login, '[bot]') && github.event.pull_request.user.type != 'Bot' && github.event.sender.type != 'Bot' && needs.changes.outputs.docs_only != 'true' }}
    needs: [changes, checks, build, smoke, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    environment:
      name: preview
      url: ${{ steps.url.outputs.url }}
    permissions:
      contents: read
      pull-requests: read # read the pull request state so a closed pull request is never deployed
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_SHA: ${{ github.sha }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools with mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          cache: false # this job holds the Cloudflare token; never restore a cache into it
      - name: Install dependencies
        run: bun run bootstrap
      - name: Require the Cloudflare secrets
        run: node scripts/preview.ts secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Stop when the pull request is no longer open
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          state="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .state)"
          if [ "$state" != "open" ]; then echo "Pull request $PR_NUMBER is $state; not deploying a preview that cleanup would miss." >&2; exit 1; fi
      - name: Name the preview Worker
        id: name
        run: node scripts/preview.ts name
      - name: Build the preview environment
        run: bun run build
        env:
          CLOUDFLARE_ENV: preview
      - name: Deploy the preview Worker
        id: deploy
        env:
          WORKER: ${{ steps.name.outputs.name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          bunx wrangler deploy --config apps/web/dist/metro_scaffold/wrangler.json --name "$WORKER" --var "PREVIEW_SHA:$PREVIEW_SHA" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
      - name: Resolve the preview URL
        id: url
        env:
          WORKER: ${{ steps.name.outputs.name }}
        run: node scripts/preview.ts url "$RUNNER_TEMP/deploy.log" "$WORKER"
      - name: Smoke the preview and prove it serves the checked commit
        env:
          PREVIEW_URL: ${{ steps.url.outputs.url }}
        run: node scripts/preview.ts smoke "$PREVIEW_URL" "$PREVIEW_SHA"
      - name: Count deployments
        id: deployments
        env:
          WORKER: ${{ steps.name.outputs.name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler deployments list --name "$WORKER" --json > "$RUNNER_TEMP/deployments.json"
          node scripts/preview.ts deployments "$RUNNER_TEMP/deployments.json"
      - name: Exercise rollback on the preview Worker
        if: ${{ steps.deployments.outputs.deployments >= 2 }}
        env:
          WORKER: ${{ steps.name.outputs.name }}
          PREVIEW_URL: ${{ steps.url.outputs.url }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler rollback --name "$WORKER" --message "Preview rollback exercise for $PREVIEW_SHA"
          node scripts/preview.ts smoke "$PREVIEW_URL"
      - name: Redeploy the checked commit after the rollback exercise
        if: ${{ always() && steps.deployments.outputs.deployments >= 2 }}
        env:
          WORKER: ${{ steps.name.outputs.name }}
          PREVIEW_URL: ${{ steps.url.outputs.url }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler deploy --config apps/web/dist/metro_scaffold/wrangler.json --name "$WORKER" --var "PREVIEW_SHA:$PREVIEW_SHA"
          node scripts/preview.ts smoke "$PREVIEW_URL" "$PREVIEW_SHA"
      - name: Record the preview in the job summary
        env:
          PREVIEW_URL: ${{ steps.url.outputs.url }}
          ROLLBACK: ${{ steps.deployments.outputs.deployments >= 2 && 'exercised' || 'skipped (first deployment, no previous version)' }}
        run: |
          {
            echo "### Cloudflare preview"
            echo "- URL: $PREVIEW_URL"
            echo "- Commit: $PREVIEW_SHA"
            echo "- Rollback: $ROLLBACK"
          } >> "$GITHUB_STEP_SUMMARY"
