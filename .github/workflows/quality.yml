name: Quality
on:
  pull_request:
    branches: [feature/metro-rebuild, main]
    # "edited" re-runs the reviewer record check when the body changes; it is not a default type.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [feature/metro-rebuild]
permissions: {}
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned tools with mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
      - name: Restore the Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun run bootstrap
      - name: Validate commit messages in the PR range
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/commit-message.ts --range "$BASE_SHA..$HEAD_SHA"
      - name: Run all checks
        run: bun run check
      - name: Upload lcov coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
  build:
    name: Build and smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools with mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
      - name: Restore the Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun run bootstrap
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("./package.json").devDependencies["@playwright/test"]')" >> "$GITHUB_OUTPUT"
      - name: Restore the Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-firefox-webkit
      - name: Install Playwright browsers
        run: bun run playwright install --with-deps chromium firefox webkit
      - name: Build the application
        run: bun run build
      - name: Run browser smoke tests
        run: bun run smoke
      - name: Upload Playwright report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
      - name: Check the bundle budget
        run: bun run bundle:check
  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned tools with mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
      - name: Restore the Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun run bootstrap
      - name: Scan dependencies and the working tree
        run: bun run scan
      - name: Scan full Git history for secrets
        run: bun run scan:history
  review:
    name: Reviewer record
    # Reads the untrusted pull request body only through the PR_BODY environment variable. It needs no token
    # beyond reading contents: changed paths come from git history, not the API. On push the step is skipped
    # and the job still succeeds so the "Quality gates" aggregate stays green.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned tools with mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install_args: node
          cache: false
      - name: Require a recorded independent reviewer
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/reviewer-record.ts
  quality:
    name: Quality gates
    if: ${{ always() }}
    needs: [checks, build, security, review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools with mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install_args: node
      - name: Verify the required job results
        run: node scripts/ci-results.ts
        env:
          REQUIRED_JOB_RESULTS: ${{ toJSON(needs) }}
  preview:
    name: Cloudflare preview
    # Same-repository pull requests only: forks must never receive the Cloudflare secrets. This job is
    # deliberately outside the "Quality gates" aggregate so Cloudflare availability cannot block merges.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    needs: [checks, build, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    environment:
      name: preview
      url: ${{ steps.url.outputs.url }}
    permissions:
      contents: read
      pull-requests: read # read the pull request state so a closed pull request is never deployed
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_SHA: ${{ github.sha }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools with mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
      - name: Restore the Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun run bootstrap
      - name: Require the Cloudflare secrets
        run: node scripts/preview.ts secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Stop when the pull request is no longer open
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          state="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .state)"
          if [ "$state" != "open" ]; then echo "Pull request $PR_NUMBER is $state; not deploying a preview that cleanup would miss." >&2; exit 1; fi
      - name: Name the preview Worker
        id: name
        run: node scripts/preview.ts name
      - name: Build the preview environment
        run: bun run build
        env:
          CLOUDFLARE_ENV: preview
      - name: Deploy the preview Worker
        id: deploy
        env:
          WORKER: ${{ steps.name.outputs.name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          bunx wrangler deploy --config apps/web/dist/metro_scaffold/wrangler.json --name "$WORKER" --var "PREVIEW_SHA:$PREVIEW_SHA" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
      - name: Resolve the preview URL
        id: url
        env:
          WORKER: ${{ steps.name.outputs.name }}
        run: node scripts/preview.ts url "$RUNNER_TEMP/deploy.log" "$WORKER"
      - name: Smoke the preview and prove it serves the checked commit
        env:
          PREVIEW_URL: ${{ steps.url.outputs.url }}
        run: node scripts/preview.ts smoke "$PREVIEW_URL" "$PREVIEW_SHA"
      - name: Count deployments
        id: deployments
        env:
          WORKER: ${{ steps.name.outputs.name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler deployments list --name "$WORKER" --json > "$RUNNER_TEMP/deployments.json"
          node scripts/preview.ts deployments "$RUNNER_TEMP/deployments.json"
      - name: Exercise rollback on the preview Worker
        if: ${{ steps.deployments.outputs.deployments >= 2 }}
        env:
          WORKER: ${{ steps.name.outputs.name }}
          PREVIEW_URL: ${{ steps.url.outputs.url }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler rollback --name "$WORKER" --message "Preview rollback exercise for $PREVIEW_SHA"
          node scripts/preview.ts smoke "$PREVIEW_URL"
      - name: Redeploy the checked commit after the rollback exercise
        if: ${{ always() && steps.deployments.outputs.deployments >= 2 }}
        env:
          WORKER: ${{ steps.name.outputs.name }}
          PREVIEW_URL: ${{ steps.url.outputs.url }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler deploy --config apps/web/dist/metro_scaffold/wrangler.json --name "$WORKER" --var "PREVIEW_SHA:$PREVIEW_SHA"
          node scripts/preview.ts smoke "$PREVIEW_URL" "$PREVIEW_SHA"
      - name: Record the preview in the job summary
        env:
          PREVIEW_URL: ${{ steps.url.outputs.url }}
          ROLLBACK: ${{ steps.deployments.outputs.deployments >= 2 && 'exercised' || 'skipped (first deployment, no previous version)' }}
        run: |
          {
            echo "### Cloudflare preview"
            echo "- URL: $PREVIEW_URL"
            echo "- Commit: $PREVIEW_SHA"
            echo "- Rollback: $ROLLBACK"
          } >> "$GITHUB_STEP_SUMMARY"
