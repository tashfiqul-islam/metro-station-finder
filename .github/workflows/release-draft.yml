name: Release draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Plane release name to draft on GitHub, for example v1.0.0
        required: true
        type: string
      target:
        description: Branch or commit the draft will tag when published
        required: false
        default: main
        type: string
permissions: {}
env:
  # METRO-45: install tools only from mise.lock URLs and checksums.
  MISE_LOCKED: "1"
concurrency:
  group: release-draft-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  draft:
    name: Draft GitHub release from Plane
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    # The environment requires the owner's approval and holds the Plane API key.
    environment: release
    permissions:
      contents: write # the minimum GitHub requires to list and create a draft release; nothing is published
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # METRO-99 (METRO-97 pattern, docs/evidence/metro-99.md): a GitHub release 504 must not fail the job on
      # one try. 2 attempts of at most 4 minutes, each only after a failed one; the last fails the job.
      - name: Install pinned tools with mise
        id: mise1
        continue-on-error: true
        timeout-minutes: 4
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install_args: node
          cache: false # this job holds the release credential; never restore a cache into it
      - name: Wait before the second tool install
        if: ${{ steps.mise1.outcome == 'failure' }}
        run: sleep 30
      - name: Install pinned tools with mise (second attempt)
        id: mise2
        if: ${{ steps.mise1.outcome == 'failure' }}
        timeout-minutes: 4
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install_args: node
          cache: false # this job holds the release credential; never restore a cache into it
      - name: Create the draft GitHub release
        run: node scripts/release-draft.ts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TARGET: ${{ inputs.target }}
          PLANE_WORKSPACE: metro-station-finder
          PLANE_API_KEY: ${{ secrets.PLANE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
