version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      tanstack:
        patterns: ["@tanstack/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      playwright:
        patterns: ["@playwright/*", "playwright"]
      types:
        patterns: ["@types/*"]
      semantic-release:
        patterns: ["semantic-release", "@semantic-release/*"]
      testing-library:
        patterns: ["@testing-library/*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
