# Metro Station Finder - Lefthook Configuration

min_version: 1.13.0

# Output configuration
output:
  - execution_out
  - summary
  - failure

# Skip unnecessary output sections
skip_output:
  - meta
  - empty_summary
  - execution_info

# Global settings
colors: true

# Pre-commit hooks
pre-commit:
  parallel: true
  
  jobs:
    - name: "TypeScript Type Check"
      run: bun run type-check
      glob: "*.{ts,tsx}"
      fail_text: "❌ TypeScript type check failed. Please fix type errors before committing."
    
    - name: "Ultracite Lint & Format"
      run: npx ultracite@latest fix
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,md,mdx}"
      stage_fixed: true
      fail_text: "❌ Linting failed. Please fix code style issues before committing."
    
    - name: "Security Audit"
      run: bun run deps:audit
      fail_text: "❌ Security vulnerabilities found. Please fix before committing."
    
    - name: "Project Validation"
      run: bun run validate
      fail_text: "❌ Project configuration validation failed. Please check your setup."
    
    - name: "Unit Tests"
      run: bun run test
      fail_text: "❌ Unit tests failed. Please fix failing tests before committing."
    
    - name: "Update Package Manager"
      run: bun run update-package-manager
      fail_text: "❌ Failed to update package manager version."
    
    - name: "Basic Validation"
      run: echo "✅ Basic validation passed!"
      fail_text: "❌ Basic validation failed."
    
    - name: "Dependency Check"
      run: bun run deps:check
      fail_text: "❌ Dependency check failed. Please review outdated packages."

# Pre-push hooks
pre-push:
  parallel: true
  follow: true
  
  jobs:
    - name: "Full TypeScript Check"
      run: bun run type-check
      fail_text: "❌ Full TypeScript validation failed. Please fix all type errors."
    
    - name: "Complete Lint Check"
      run: npx ultracite@latest check
      fail_text: "❌ Complete linting check failed. Please fix all code style issues."
    
    - name: "Full Test Suite"
      run: bun run test
      fail_text: "❌ Test suite failed. Please fix all failing tests."
    
    - name: "Build Verification"
      run: bun run build
      fail_text: "❌ Build failed. Please fix build errors before pushing."
    
    - name: "E2E Tests"
      run: bun run e2e
      only:
        - ref: "master"
        - ref: "main"
        - ref: "develop"
      fail_text: "❌ E2E tests failed. Please fix end-to-end test failures."
    
    - name: "Bundle Analysis"
      run: bun run analyze
      only:
        - ref: "master"
        - ref: "main"
      fail_text: "❌ Bundle analysis failed. Please check bundle size and dependencies."

# Commit-msg hooks
commit-msg:
  jobs:
    - name: "Conventional Commits"
      run: npx commitlint --edit $1
      fail_text: "❌ Invalid commit message format. Please use conventional commits."

# Post-commit hooks
post-commit:
  jobs:
    - name: "Post-Commit Cleanup"
      run: echo "✅ Commit completed successfully!"
      fail_text: "⚠️  Post-commit cleanup failed. Project may need attention."

# Post-merge hooks
post-merge:
  jobs:
    - name: "Install Dependencies"
      run: bun install
      fail_text: "❌ Failed to install dependencies after merge."
    
    - name: "Update Package Manager"
      run: bun run update-package-manager
      fail_text: "❌ Failed to update package manager version."
    
    - name: "Post-Merge Health Check"
      run: bun run health
      fail_text: "⚠️  Post-merge health check failed. Project may need attention."

# Post-checkout hooks
post-checkout:
  jobs:
    - name: "Install Dependencies"
      run: bun install
      fail_text: "❌ Failed to install dependencies after checkout."
    
    - name: "Update Package Manager"
      run: bun run update-package-manager
      fail_text: "❌ Failed to update package manager version."
    
    - name: "Post-Checkout Health Check"
      run: bun run health
      fail_text: "⚠️  Post-checkout health check failed. Project may need attention."
